name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  actions: write

jobs:
  prune-caches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Prune stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install actions/gh-actions-cache 2>/dev/null || true
          # Delete all CodeQL caches — they are recreated per run and bloat storage
          for key in $(gh cache list --limit 100 --json key --jq '.[].key' | grep '^codeql'); do
            gh cache delete "$key" --confirm || true
          done
          # Keep only the latest pnpm store cache per OS
          for key in $(gh cache list --limit 100 --json key --jq '.[].key' | grep '^Linux-pnpm-store' | sort -u); do
            count=$(gh cache list --limit 100 --json key --jq ".[] | select(.key==\"$key\") | .key" | wc -l)
            if [ "$count" -gt 1 ]; then
              gh cache list --limit 100 --json id,key,createdAt --jq "
                .[] | select(.key==\"$key\") | .id
              " | tail -n +2 | xargs -I{} gh cache delete {} --confirm || true
            fi
          done

  linux-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate registry index
        run: node scripts/generate-domains-index.mjs

      - name: Assert generated registry is committed and current
        # The step above OVERWRITES the three generated-*.ts files, so every
        # downstream guard would otherwise be comparing the freshly generated
        # output against itself. `audit:domains` check 1 in particular is
        # tautological without this step: it diffs generated-tool-domains.ts
        # against initRegistry(), and CI has just written that file from the
        # same registry. A stale committed artifact is what .gitignore's NOTE
        # says must never ship, so pin it here.
        #
        # `--exit-code` (not `--stat`) so the diff is actually visible in the log.
        run: |
          if ! git diff --exit-code -- src/server/registry/generated-domains.ts src/server/registry/generated-tool-catalog.ts src/server/registry/generated-tool-domains.ts; then
            echo "::error::Committed generated-*.ts is stale. Run 'node scripts/generate-domains-index.mjs' and commit the result."
            exit 1
          fi

      - name: Contract & drift guards
        # Guards for the "hand-maintained artifact drifted from the thing it
        # describes" class of bug: registry metadata, the openapi surface, domain
        # integrity, event contracts, and the tool audit. All five are read-only.
        #
        # `metadata:check` guards BOTH copies of the tool count: the generated
        # registry block and the hand-written README prose. The prose copy is the
        # one that drifted unnoticed from 2026-10-04 to 2026-10-09 — see
        # scripts/audit-readme-counts.mjs for the guard and why it exists.
        #
        # Four of these five previously ran only through `pnpm run check`, which
        # is invoked solely by publish-packages.yml, a tag-triggered workflow —
        # so on a pull request they never executed at all, and a desync surfaced
        # only at release time. The fifth, `audit:tools`, was not in `check` at
        # all and had never run in CI; it is listed here on its own merit.
        #
        # Deliberately NOT included: `audit:events:selftest` and
        # `audit:readme-counts:selftest`. Both write to the tree by design, to
        # prove the audit can actually fail; a CI job that mutates source is a
        # hazard rather than a check (see their own header comments).
        run: |
          pnpm run metadata:check
          pnpm run openapi:check
          pnpm run audit:domains
          pnpm run audit:events
          pnpm run audit:tools

      - name: Run Linters, Formatters & Typecheck
        run: |
          pnpm run lint
          pnpm run format:check
          pnpm run typecheck

      # ── Per-tool scorecard measurement pipeline ──────────────────────────
      # The scorecard is a renderer over THREE independent measurement files,
      # all produced by separate commands. Under CI (CI=true) the
      # `per-tool/layers-actually-measured` gate does NOT skip: it runs INSIDE
      # the `server` vitest project and hard-fails if any of these are absent:
      #   coverage/coverage-final.json  (unit layer, written BY test:coverage)
      #   artifacts/benchmarks/e2e-results.json        (bench:e2e)
      #   artifacts/benchmarks/retrieval-metrics.json  (retrieval-metrics.test.ts)
      #
      # ORDER IS THE WHOLE POINT. e2e + retrieval must exist BEFORE
      # test:coverage, because that run contains the gate. The old order put
      # bench:e2e AFTER test:coverage, so the gate always failed on CI (the
      # e2e file did not exist yet) — the "wired" layers were dead on arrival.
      # coverage is the one exception: the gate's validate() exempts an
      # in-progress COVERAGE_FULL run, since test:coverage writes that file
      # itself during the very run being gated.
      #
      # After the gate passes, `bench:tools` regenerates the scorecard from
      # all three REAL measurements and the result is uploaded, so the numbers
      # are actually consumed instead of being dead-end artifacts.
      # The e2e layer is served locally by scripts/serve-e2e-fixture.mjs
      # (deterministic, no external network) — see the e2e step below.

      - name: Run e2e real-task layer (self-hosted target, before the gate)
        # Produces artifacts/benchmarks/e2e-results.json, the input for the
        # scorecard's e2e-tasks column.
        #
        # `bench:e2e:local` (scripts/bench-e2e-local.mjs) owns the whole
        # server lifecycle: it starts scripts/serve-e2e-fixture.mjs (a
        # deterministic, dependency-free local HTTP origin at 127.0.0.1:4173),
        # waits for readiness, runs the real 3-round pass^k measurement against
        # it, then ALWAYS stops the server — even on failure/signal. Keeping
        # that logic in ONE script (not duplicated in YAML shell) means CI and
        # local `pnpm bench:e2e:local` are identical. No external network, no
        # third-party deploy, no new dependencies.
        #
        # `continue-on-error` still guards the one genuinely flaky dependency:
        # a headless Chromium launch on the runner. bench-e2e.mjs ALWAYS writes
        # e2e-results.json (even when zero files pass all 3 rounds), so the
        # measurement is real in both cases. The fallback covers the step being
        # killed by the timeout before the script reaches its write by emitting
        # an EXPLICIT empty measurement — never a guessed value.
        continue-on-error: true
        timeout-minutes: 20
        env:
          VITEST_MAX_WORKERS: 2
          PUPPETEER_HEADLESS: 'true'
          E2E_FIXTURE_PORT: '4173'
        run: |
          pnpm run bench:e2e:local
          if [ ! -f artifacts/benchmarks/e2e-results.json ]; then
            echo "::warning::bench:e2e produced no file — emitting an honest empty measurement"
            mkdir -p artifacts/benchmarks
            printf '%s\n' '{"generatedAt":"","suite":"tests/e2e (real tasks)","metric":"pass^k (min pass rate across rounds)","rounds":0,"passRateThreshold":0.9,"measuredFiles":[],"fileStats":{},"totalTests":0,"passedTests":0,"toolFileCounts":{},"note":"e2e step did not complete; zero files measured — honest empty result, not a guess"}' > artifacts/benchmarks/e2e-results.json
          fi

      - name: Measure retrieval layer (before the scorecard gate)
        # retrieval-metrics.test.ts writes artifacts/benchmarks/retrieval-metrics.json
        # (+ per-tool evidence). Running it standalone BEFORE the full suite
        # removes the parallel-worker race: with VITEST_MAX_WORKERS=4 the gate
        # (tools-benchmark.test.ts) could otherwise execute before this test
        # wrote its file. The full test:coverage run below re-runs it
        # idempotently; that rewrite is harmless because the file already exists.
        run: pnpm exec vitest run --project server tests/server/benchmarks/retrieval-metrics.test.ts

      - name: Run Unit Tests with Coverage (runs the scorecard gate)
        # All three measurement files now exist, so the CI-strict
        # layers-actually-measured gate passes on real data. This run also
        # writes coverage/coverage-final.json (COVERAGE_FULL=true), which the
        # gate exempts as an in-progress measurement.
        # Cap vitest workers: the smart runner otherwise picks ~10 workers and
        # the v8 coverage instrumentation OOMs the hosted runner (linux-full
        # died with "out of memory OS dump" — see PR #128 discussion).
        env:
          VITEST_MAX_WORKERS: 4
        run: pnpm run test:coverage

      - name: Regenerate the scorecard from all measured layers
        # BENCH_SCORECARD=1 (set by bench-tools.mjs) makes the gate test write
        # artifacts/benchmarks/scorecard.{md,json}; the per-tool scorecard case
        # writes per-tool-scorecard.{md,json}. With all three inputs present the
        # result has real handler-fn / e2e-tasks / retrieval columns — no
        # "not measured" placeholders. This is the step that CONSUMES what the
        # three preceding steps produced.
        run: pnpm run bench:tools

      - name: Publish measurement + scorecard artifacts
        # Stage the full, fully-measured scorecard set for a single upload.
        # coverage/coverage-final.json is copied in so the uploaded bundle is
        # self-contained (the handler-fn layer's source of truth travels with
        # the rendered scorecard).
        if: always()
        run: |
          mkdir -p artifacts/benchmarks-ci
          cp -f artifacts/benchmarks/scorecard.md artifacts/benchmarks-ci/ 2>/dev/null || true
          cp -f artifacts/benchmarks/scorecard.json artifacts/benchmarks-ci/ 2>/dev/null || true
          cp -f artifacts/benchmarks/per-tool-scorecard.md artifacts/benchmarks-ci/ 2>/dev/null || true
          cp -f artifacts/benchmarks/per-tool-scorecard.json artifacts/benchmarks-ci/ 2>/dev/null || true
          cp -f artifacts/benchmarks/e2e-results.json artifacts/benchmarks-ci/ 2>/dev/null || true
          cp -f artifacts/benchmarks/retrieval-metrics.json artifacts/benchmarks-ci/ 2>/dev/null || true
          cp -f coverage/coverage-final.json artifacts/benchmarks-ci/ 2>/dev/null || true
          echo "[ci] staged $(find artifacts/benchmarks-ci -maxdepth 1 -type f | wc -l) measurement/scorecard files"

      - name: Upload benchmark scorecard bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-scorecard
          path: artifacts/benchmarks-ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Build project
        run: pnpm run build

  cross-platform-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate registry index
        run: node scripts/generate-domains-index.mjs

      - name: Build project
        run: pnpm run build
