name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  actions: write

jobs:
  prune-caches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Prune stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install actions/gh-actions-cache 2>/dev/null || true
          # Delete all CodeQL caches — they are recreated per run and bloat storage
          for key in $(gh cache list --limit 100 --json key --jq '.[].key' | grep '^codeql'); do
            gh cache delete "$key" --confirm || true
          done
          # Keep only the latest pnpm store cache per OS
          for key in $(gh cache list --limit 100 --json key --jq '.[].key' | grep '^Linux-pnpm-store' | sort -u); do
            count=$(gh cache list --limit 100 --json key --jq ".[] | select(.key==\"$key\") | .key" | wc -l)
            if [ "$count" -gt 1 ]; then
              gh cache list --limit 100 --json id,key,createdAt --jq "
                .[] | select(.key==\"$key\") | .id
              " | tail -n +2 | xargs -I{} gh cache delete {} --confirm || true
            fi
          done

  linux-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate registry index
        run: node scripts/generate-domains-index.mjs

      - name: Assert generated registry is committed and current
        # The step above OVERWRITES the three generated-*.ts files, so every
        # downstream guard would otherwise be comparing the freshly generated
        # output against itself. `audit:domains` check 1 in particular is
        # tautological without this step: it diffs generated-tool-domains.ts
        # against initRegistry(), and CI has just written that file from the
        # same registry. A stale committed artifact is what .gitignore's NOTE
        # says must never ship, so pin it here.
        #
        # `--exit-code` (not `--stat`) so the diff is actually visible in the log.
        run: |
          if ! git diff --exit-code -- src/server/registry/generated-domains.ts src/server/registry/generated-tool-catalog.ts src/server/registry/generated-tool-domains.ts; then
            echo "::error::Committed generated-*.ts is stale. Run 'node scripts/generate-domains-index.mjs' and commit the result."
            exit 1
          fi

      - name: Contract & drift guards
        # Guards for the "hand-maintained artifact drifted from the thing it
        # describes" class of bug: registry metadata, the openapi surface, domain
        # integrity, event contracts, and the tool audit. All five are read-only.
        #
        # `metadata:check` guards BOTH copies of the tool count: the generated
        # registry block and the hand-written README prose. The prose copy is the
        # one that drifted unnoticed from 2026-10-04 to 2026-10-09 — see
        # scripts/audit-readme-counts.mjs for the guard and why it exists.
        #
        # Four of these five previously ran only through `pnpm run check`, which
        # is invoked solely by publish-packages.yml, a tag-triggered workflow —
        # so on a pull request they never executed at all, and a desync surfaced
        # only at release time. The fifth, `audit:tools`, was not in `check` at
        # all and had never run in CI; it is listed here on its own merit.
        #
        # Deliberately NOT included: `audit:events:selftest` and
        # `audit:readme-counts:selftest`. Both write to the tree by design, to
        # prove the audit can actually fail; a CI job that mutates source is a
        # hazard rather than a check (see their own header comments).
        run: |
          pnpm run metadata:check
          pnpm run openapi:check
          pnpm run audit:domains
          pnpm run audit:events
          pnpm run audit:tools

      - name: Run Linters, Formatters & Typecheck
        run: |
          pnpm run lint
          pnpm run format:check
          pnpm run typecheck

      - name: Run Unit Tests with Coverage
        # Cap vitest workers: the smart runner otherwise picks ~10 workers and
        # the v8 coverage instrumentation OOMs the hosted runner (linux-full
        # died with "out of memory OS dump" — see PR #128 discussion).
        env:
          VITEST_MAX_WORKERS: 4
        run: pnpm run test:coverage

      - name: Build project
        run: pnpm run build

  cross-platform-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate registry index
        run: node scripts/generate-domains-index.mjs

      - name: Build project
        run: pnpm run build
