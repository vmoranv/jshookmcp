version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # mockttp 4.5.0 adds tls-impersonate, which requires Node >=24.15.0.
      - dependency-name: "mockttp"
        update-types:
          - "version-update:semver-minor"
      # No security-update ignores: basic-ftp 6.2.4 / node-forge 1.4.3 are
      # already pinned at their advisory-fixed versions. Semver-patch ignores
      # only ever suppressed the unavailable-fix retries AND blocked unrelated
      # patch updates; both are obsolete now that upstream shipped the fixes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
